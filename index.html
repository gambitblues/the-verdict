<style>
#verdict-entry{position:fixed;inset:0;z-index:99999;background:rgba(8,18,30,.97);color:#f6f0e6;display:flex;align-items:center;justify-content:center;padding:20px;font-family:inherit}
#verdict-entry .entry-card{width:min(420px,100%);padding:30px 24px;background:linear-gradient(145deg,#192c40,#253b4d);border:1px solid #987f62;border-radius:22px;box-shadow:0 24px 75px #0009;text-align:center}

#verdict-entry .entry-sub{color:#c6d1d7;font-size:13px;line-height:1.7;margin-bottom:28px}
#verdict-entry .entry-btn{display:block;width:100%;padding:15px;border-radius:12px;margin:11px 0;border:1px solid #8eabb7;background:#29475e;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
#verdict-entry .entry-btn.primary{background:#b88d58;color:#132032;border-color:#d4ad78}
#verdict-entry .entry-btn:disabled{opacity:.45;cursor:not-allowed}
#verdict-entry .entry-info{font-size:12px;color:#b6c5cc;margin-top:18px;line-height:1.8}
