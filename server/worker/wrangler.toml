# THE VERDICT API — deploy with `npx wrangler deploy` from server/worker (develop only; nothing here ships to GitHub Pages)
name = "the-verdict-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Terra QA libraries use the Node.js crypto shim in the Worker bundle.
compatibility_flags = ["nodejs_compat"]

# Run at 03:00 KST (18:00 UTC), but NEVER spend unless TERRA_REFILL_ENABLED='1'.
[triggers]
crons = ["0 18 * * *"]

[vars]
TERRA_REFILL_ENABLED = "0"
# P4 server-based shared docket remains disabled until QA and explicit deployment approval.
P4_SHARED_DOCKET_ENABLED = "0"
P4_TRIAL_PARITY_ENABLED = "0" # native verdict score+legal sentence; QA-only
P4_JUDGMENTS_ENABLED = "0" # only enable in independent P4 QA
P4_FREE_ORDERS_ENABLED = "0" # metered AI interpretation; QA-only
P5_JOINT_PANEL_ENABLED = "0" # QA-only, no production panel votes
JOINT_WAIT_HOURS = "72" # how long the presiding judge waits before seating a substitute associate (server minimum 24)
P4_COURT_ACTIONS_ENABLED = "0" # never accept courtroom writes on an unverified deployment
# These are conservative EXAMPLE caps, not live-spending authorization.
TERRA_MAX_CALLS_DAY = "4"
TERRA_MAX_USD_DAY = "0.30"
TERRA_MAX_USD_CASE = "0.30"
TERRA_TARGET_STOCK = "1"
TERRA_MAX_BATCH = "1"
# Supabase project "THE VERDICT" (Seoul). The anon key is public by design; the service role key is a secret.
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
SUPABASE_ANON_KEY = "YOUR-ANON-KEY"
# pages allowed to call this API (comma separated). localhost is always allowed for testing.
ALLOWED_ORIGINS = "https://gambitblues.github.io"
# the two invited players — must ALSO be in the Supabase table public.players (both lists are checked)
ALLOWED_EMAILS = "player1@example.com,player2@example.com"
MODEL_CASE = "gpt-6.1-terra"
MODEL_TALK = "gpt-6-luna"
# USD per 1M tokens — check against OpenAI's price page and edit here; cost logging follows this table
PRICES = '{"gpt-6.1-terra":{"in":1.0,"out":5.0},"gpt-6-luna":{"in":0.10,"out":0.50}}'
# per player per day (KST)
DAILY_CALLS = "300"
DAILY_USD = "1.00"
# second AI pass that compares meaning before a rewrite is accepted ("0" turns it off)
VERIFY = "1"
# "1" only while running scripts/smoke.mjs (lets it trigger a deliberate failure); keep "0" otherwise
ALLOW_TEST_FAIL = "0"

# secrets (not in this file):
#   npx wrangler secret put OPENAI_API_KEY            (already set)
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
