name: Develop runtime and mobile smoke QA
on:
  push:
    branches: [develop]
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bundled Javascript and case packs
        run: |
          node --check game_runtime.js
          node --check game_hearings.js
          node --check game_professions.js
          node --check game_ui.js
          node --check trial_core.js
          node --check media_desk.js
          node --check trial_play.js
          node --check world_feed.js
          node --check people_map.js
          node --check v6_world.js
          node --check save_store.js
          node tests/media-desk.test.cjs
          node tests/save-store.test.cjs
          node --check curated_cases.js
          node tests/narrative-qa.cjs
          node tests/trial-core.test.cjs
          node tests/v6-case-matrix.test.cjs
          node tests/v6-behaviour.test.cjs
          node tests/version.test.cjs
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('content-packs/court-editorial-100-v1.json'));if(p.cases.length!==100)process.exit(1)"
      - name: Advanced case engine and linked pilot regression
        run: |
          node tests/advanced-case-engine.test.cjs
          node tests/advanced-witness-engine.test.cjs
          node tests/advanced-timeline-evidence.test.cjs
          node tests/advanced-courtroom-conflict.test.cjs
          node tests/advanced-pilot-integration.test.cjs
          node tests/advanced-world-schema.test.cjs
          node tests/advanced-production-ledger.test.cjs
          node tests/advanced-story-beats-99.test.cjs
      - name: Install browser test tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Visual layer (mobile, tablet, desktop, read-only rendering)
        run: node tests/visuals.mjs
      - name: Responsive layout (phones, Fold folded/unfolded, tablet, desktop)
        run: node tests/responsive.mjs
      - name: Evidence shapes and witness moments (visual review gallery)
        run: node tests/evidence-moments.mjs
      - name: Run mobile viewport browser test
        run: node tests/browser-smoke.mjs
      - name: v6 features end to end (decision cases, witnesses, confrontation, face-off, bench, truth, experts, pressure, personnel season)
        run: node tests/v6-flow.mjs
      - name: Judge's orders and follow-up nodes (60 cases × 30 seeds through every hearing, 20 cases on screen, new-game wipe)
        run: node tests/court-orders.mjs
      - name: v5.7 save migration (real fixture, plain and compressed)
        run: node tests/v5-migration.mjs
      - name: 60 cases × 30 casts narrative checks
        run: node tests/v6-narrative-combos.mjs
      - name: Visual update long-career regression
        run: node tests/long-career.mjs 40
      - name: Save graphical QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphical-qa
          path: qa-visuals/
          if-no-files-found: ignore
