name: THE VERDICT Worker regression tests
on:
  push:
    branches: [develop]
    paths:
      - 'server/worker/**'
      - '.github/workflows/worker-regression.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'server/worker/**'
      - '.github/workflows/worker-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline Worker regression tests (no external API calls)
        working-directory: server/worker
        run: npm test
